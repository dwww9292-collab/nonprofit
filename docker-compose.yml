services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: npo
      POSTGRES_PASSWORD: npo
      POSTGRES_DB: npo_sales
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npo -d npo_sales"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://npo:npo@db:5432/npo_sales
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ionesoftbank.co.kr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234!}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # 기동 시 마이그레이션 + 기본 시드까지 수행 (데모 데이터는 --demo로 별도 실행)
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
