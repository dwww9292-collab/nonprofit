# 비밀값은 .env 파일에서 읽는다. .env가 없거나 값이 비어 있으면 compose가 기동을 거부한다
# (기본값을 두면 저장소에 공개된 비밀번호로 서비스가 떠버리므로 일부러 폴백을 두지 않았다).
#
#   cp .env.example .env   후 값을 채우고   docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER를 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-npo_sales}
      # pg_trgm 은 LC_CTYPE 으로 '문자'를 판정한다. 기본 로케일 C 에서는 한글이
      # 문자로 분류되지 않아 트라이그램이 하나도 만들어지지 않고,
      # similarity('예시복지재단','예시복지재단') 이 1이 아니라 0이 된다.
      # 그러면 중복판정 4단계(유사 명칭 중복의심)가 조용히 전혀 동작하지 않는다.
      # 이 설정은 pgdata 볼륨을 처음 만들 때만 적용된다 — 기존 볼륨은
      # docs/08-deploy.md 의 점검 절차로 확인할 것.
      POSTGRES_INITDB_ARGS: "--lc-ctype=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # DB 포트는 외부로 열지 않는다. 같은 compose 네트워크의 backend만 접근하면 된다.
    # 로컬에서 psql로 붙어야 하면 아래 주석을 풀되, 운영에서는 열지 말 것.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-npo_sales}
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET을 설정하세요 (python -c "import secrets; print(secrets.token_urlsafe(48))")}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env에 ADMIN_PASSWORD를 설정하세요}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    # 기동 시 마이그레이션 + 기본 시드까지 수행 (데모 데이터는 --demo로 별도 실행)
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      # 기본은 로컬 전용. 사내망에 공개하려면 .env 에 BIND_ADDR=0.0.0.0 을 둔다
      # (docs/08-deploy.md). compose 는 override 파일의 ports 를 합쳐버리므로
      # 노출 범위는 override 가 아니라 이 변수로만 제어한다.
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-3000}:80"

volumes:
  pgdata:
